name: Verify VL2 WS2 materials
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y libreoffice-writer libreoffice-calc fonts-noto-cjk libcairo2
      - run: npm install --no-save --package-lock=false playwright@1.62.1
      - run: npx playwright install --with-deps chromium
      - run: python -m pip install -r paperwork/requirements.txt openpyxl pypdf
      - run: echo "CHROMIUM_PATH=$(node -p 'require("playwright").chromium.executablePath()')" >> "$GITHUB_ENV"
      - run: node paperwork/build.cjs --check
      - run: python tests/paperwork_pdf.py
      - run: node tests/paperwork.cjs
      - run: node tests/graph.cjs
      - run: node tests/split.cjs
      - run: python tests/split_excel.py
      - run: node tests/v3.cjs
      - run: python tests/v3_excel.py
      - run: node tests/language.cjs
      - run: node paperwork/build.cjs
      - run: python tests/paperwork_pdf.py
      - uses: actions/upload-artifact@v4
        with:
          name: VL2-bilingual-WS2
          path: paperwork/generated/
